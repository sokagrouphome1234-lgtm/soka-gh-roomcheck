<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>グループホーム空室情報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2FA966;
    --green-deep:#1F8A4F;
    --green-pale:#E4F4EA;
    --orange:#FF8A3B;
    --orange-deep:#F07422;
    --orange-pale:#FFF0E2;
    --bg:#F6F8F2;
    --card:#FFFFFF;
    --textmain:#3A3A3A;
    --textsub:#84887E;
    --red:#E9573F;
    --red-bg:#FDEBE7;
    --line:#ECEEE7;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:"M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--textmain); padding-bottom:90px;
  }
  header{
    background:var(--green); color:#fff; padding:16px 16px 14px;
    position:sticky; top:0; z-index:50;
    border-radius:0 0 20px 20px;
    box-shadow:0 2px 10px rgba(47,169,102,.28);
  }
  header h1{margin:0; font-size:17px; font-weight:800; letter-spacing:.5px;}
  .sub-row{display:flex; align-items:center; justify-content:space-between; margin-top:3px; gap:10px;}
  header .sub{font-size:11px; opacity:.9; display:flex; align-items:center; gap:6px;}
  .refresh-btn{
    font-size:11px; font-weight:700; color:var(--green-deep); background:#fff; border:none;
    border-radius:999px; padding:5px 12px; cursor:pointer; flex-shrink:0;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
    font-family:inherit;
  }
  .refresh-btn:active{ transform:scale(.96); }
  .refresh-btn.spinning{ opacity:.6; }
  .dot{width:7px; height:7px; border-radius:50%; background:#cfe9da; flex-shrink:0;}
  .dot.ok{background:#4A90E2;}
  .dot.busy{background:#FFD27C;}
  .dot.err{background:#E9573F;}

  .tabs{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff;
    border-top:1px solid var(--line); z-index:60; padding-bottom:env(safe-area-inset-bottom);
  }
  .scroll-top-btn{
    position:fixed; right:16px; bottom:calc(74px + env(safe-area-inset-bottom));
    width:44px; height:44px; border-radius:50%; border:none;
    background:var(--orange); color:#fff; font-size:16px; box-shadow:0 3px 10px rgba(240,116,34,.4);
    z-index:70; cursor:pointer;
    opacity:0; pointer-events:none; transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease;
    font-family:inherit;
  }
  .scroll-top-btn.show{
    opacity:1; pointer-events:auto; transform:translateY(0);
  }
  .tab{
    flex:1; text-align:center; padding:9px 0 7px; font-size:11.5px; color:#A7ABA0;
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    user-select:none; font-weight:500;
  }
  .tab .ic{
    font-size:18px; line-height:1;
    padding:4px 16px; border-radius:999px;
    transition:background-color .15s ease;
  }
  .tab.active{color:var(--green-deep); font-weight:800;}
  .tab.active .ic{background:var(--green-pale);}

  .screen{display:none; padding:16px 14px 10px; max-width:560px; margin:0 auto;}
  .screen.active{display:block;}

  /* ---- トップ画面 ---- */
  .company-card{
    background:var(--card); border-radius:var(--radius); margin-bottom:12px;
    box-shadow:0 2px 8px rgba(60,90,60,.07); overflow:hidden;
    border:1px solid var(--line);
  }
  .company-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:15px 16px; cursor:pointer;
  }
  .company-name{font-size:15.5px; font-weight:800; color:var(--green-deep);}
  .company-vacancy{font-size:12px; margin-top:3px; color:var(--textsub); font-weight:500;}
  .company-vacancy b{color:var(--red); font-size:15px; font-weight:800;}
  .company-phone{font-size:11.5px; color:var(--textsub); margin-top:2px;}
  .company-phone a{color:var(--green-deep); text-decoration:none;}
  .company-vacant-home{font-size:12px; margin-top:2px; color:var(--textsub); font-weight:500;}
  .company-vacant-home b{color:var(--red); font-weight:800;}
  .company-updated{font-size:10.5px; color:#AEB2A8; margin-top:4px;}
  .contact-label{
    font-size:11px; color:var(--green-deep); font-weight:800; padding:12px 16px 4px;
  }
  .contact-chips{
    display:flex; flex-direction:column; gap:6px;
    padding:0 16px 10px;
  }
  .contact-chip{
    font-size:11px; color:var(--textsub); background:var(--green-pale); border-radius:12px;
    padding:6px 11px; white-space:normal; align-self:flex-start;
  }
  .contact-chip a{color:var(--green-deep); text-decoration:none; font-weight:700;}
  .chevron{transition:transform .25s cubic-bezier(.4,0,.2,1); color:#C4C8BE; font-size:14px;}
  .company-card.open .chevron{transform:rotate(90deg);}
  .home-list{
    border-top:1px solid var(--line); overflow:hidden; max-height:0;
    transition:max-height .3s cubic-bezier(.4,0,.2,1);
    background:#FBFCF8;
  }
  .home-row{
    display:flex; flex-direction:column; gap:6px;
    padding:12px 16px; font-size:13.5px; border-bottom:1px solid var(--line);
  }
  .home-row-top{display:flex; justify-content:space-between; align-items:center;}
  .home-address{
    font-size:11.5px; color:var(--textsub);
  }
  .home-building{
    margin-left:19px; margin-top:-2px;
  }
  .home-notes{
    font-size:11.5px; color:var(--textsub); background:var(--orange-pale); border-radius:10px;
    padding:8px 10px; white-space:pre-wrap; line-height:1.5;
  }
  .home-row:last-child{border-bottom:none;}
  .home-left{display:flex; flex-direction:column; gap:5px; align-items:flex-start;}
  .home-badges{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .gender-badge{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; flex-shrink:0;
  }
  .gender-male{background:#5B9BEF;}
  .gender-female{background:#F282A6;}
  .gender-any{background:#A98BE0;}
  .type-badge{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; color:var(--orange-deep);
    background:var(--orange-pale); flex-shrink:0; white-space:nowrap;
  }
  .home-name{font-weight:700; font-size:14.5px;}
  .status-pill{
    font-size:11.5px; padding:3px 10px; border-radius:999px; font-weight:800; white-space:nowrap;
  }
  .status-vacant{background:var(--green-pale); color:var(--green-deep);}
  .status-full{background:var(--red-bg); color:var(--red);}
  .home-count{font-size:11.5px; color:var(--textsub); margin-left:6px; font-weight:500;}

  .empty-msg{text-align:center; color:#A7ABA0; font-size:13px; padding:40px 0; line-height:1.7;}

  .sort-bar{
    display:flex; gap:0; margin-bottom:14px;
    background:#fff; border-radius:999px; padding:4px;
    border:1px solid var(--line);
    box-shadow:0 1px 4px rgba(60,90,60,.06);
  }
  .sort-btn{
    flex:1; padding:8px 0; border-radius:999px; font-size:12.5px; border:none;
    background:transparent; color:#9BA095; cursor:pointer; font-weight:700;
    font-family:inherit;
    transition:background-color .15s ease, color .15s ease;
  }
  .sort-btn.active{
    background:var(--green); color:#fff;
    box-shadow:0 1px 4px rgba(47,169,102,.35);
  }

  /* ---- 掲示板 ---- */
  .board-post{
    background:var(--card); border-radius:var(--radius); padding:15px 16px; margin-bottom:11px;
    box-shadow:0 2px 8px rgba(60,90,60,.07);
    border:1px solid var(--line);
  }
  .board-meta{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; gap:8px;}
  .board-company{font-size:12px; font-weight:800; color:var(--orange-deep); background:var(--orange-pale); padding:3px 10px; border-radius:999px;}
  .board-date{font-size:11px; color:var(--textsub);}
  .board-author-top{font-size:11px; color:var(--textsub); font-weight:500;}
  .board-text{font-size:14px; line-height:1.65; white-space:pre-wrap;}
  .board-date-bottom{font-size:11px; color:#AEB2A8; margin-top:8px; text-align:right;}
  .board-author{font-size:11.5px; color:var(--textsub); margin-top:8px; text-align:right;}

  /* ---- 編集画面 ---- */
  .edit-section{
    background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px;
    box-shadow:0 2px 8px rgba(60,90,60,.07);
    border:1px solid var(--line);
  }
  .edit-section h3{margin:0 0 12px; font-size:14px; font-weight:800; color:var(--green-deep); border-bottom:2px solid var(--green-pale); padding-bottom:7px;}
  label{display:block; font-size:12px; color:var(--textsub); margin:10px 0 4px; font-weight:700;}
  input[type=text], input[type=number], input[type=url], select, textarea{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:14px;
    background:#FBFCF8; font-family:inherit; color:var(--textmain);
  }
  input:focus, select:focus, textarea:focus{
    outline:none; border-color:var(--green); background:#fff;
  }
  textarea{resize:vertical; min-height:70px;}
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}

  .btn{
    display:block; width:100%; text-align:center; padding:13px 0; border-radius:999px;
    background:var(--green); color:#fff; font-size:14px; font-weight:800; border:none;
    margin-top:14px; cursor:pointer; font-family:inherit;
    box-shadow:0 2px 6px rgba(47,169,102,.3);
  }
  .btn:active{opacity:.85; transform:scale(.99);}
  .btn-outline{background:#fff; color:var(--green-deep); border:2px solid var(--green); box-shadow:none;}
  .home-edit-item{
    border:1.5px solid var(--line); border-radius:14px; margin-top:12px; position:relative; background:#FBFCF8;
    overflow:hidden;
  }
  .home-edit-item .del-x{
    position:absolute; top:9px; right:11px; color:#C4C8BE; font-size:18px; cursor:pointer; line-height:1; z-index:2;
  }
  .small-gray{font-size:11px; color:#A7ABA0; margin-top:4px;}
  .home-edit-item.draft-item{
    border:2px dashed var(--orange); background:var(--orange-pale); padding:13px;
  }
  .home-edit-item[data-contact-id]{ padding:13px; }
  .home-edit-summary{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:13px 34px 13px 13px; cursor:pointer;
  }
  .home-edit-summary-text{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .home-edit-summary-badges{display:flex; gap:6px; flex-wrap:wrap;}
  .home-edit-summary-name{font-weight:700; font-size:14px; color:var(--textmain); overflow-wrap:anywhere;}
  .home-edit-item .home-chevron-edit{
    margin-left:auto; flex-shrink:0; color:#C4C8BE; font-size:14px;
    transition:transform .25s cubic-bezier(.4,0,.2,1);
  }
  .home-edit-item.open .home-chevron-edit{transform:rotate(90deg);}
  .home-edit-detail{
    display:none; padding:0 13px 13px; border-top:1px solid var(--line);
  }
  .home-edit-item.open .home-edit-detail{display:block; padding-top:13px;}

  .post-edit-row{
    display:flex; justify-content:flex-end; gap:8px; margin-top:10px;
  }
  .icon-btn{
    font-size:12px; font-weight:700; color:var(--green-deep); background:#fff; border:1.5px solid var(--green); border-radius:999px;
    padding:6px 14px; cursor:pointer; font-family:inherit;
  }
  .icon-btn.danger{color:var(--red); border-color:#F3C4BA;}
  .icon-btn-lg{
    font-size:15px; font-weight:800; padding:11px 30px; border-radius:999px;
    background:var(--orange); color:#fff; border:none; font-family:inherit;
    box-shadow:0 2px 6px rgba(240,116,34,.35);
  }
  .icon-btn-lg:active{transform:scale(.97);}

  .company-block{
    padding-top:0; margin-top:16px; overflow:hidden;
    border:none;
  }
  .company-block-title{
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    padding:12px 2px;
    border-top:2px solid var(--green-pale);
  }
  .company-block-title h3{border:none; margin:0; padding:0;}
  .company-number{
    display:inline-block; min-width:22px; text-align:center;
    color:#fff; background:var(--green); border-radius:999px;
    margin-right:7px; font-weight:800; font-size:12px; padding:2px 7px;
  }
  .section-label{
    font-size:17px; color:#fff; font-weight:800; margin:24px 0 10px; letter-spacing:1px;
    background:var(--orange); padding:11px 14px; border-radius:999px; text-align:center;
    box-shadow:0 2px 8px rgba(240,116,34,.3);
  }
  .company-block-title-right{display:flex; align-items:center; gap:10px;}
  .chevron-edit{
    transition:transform .25s cubic-bezier(.4,0,.2,1); color:#C4C8BE; font-size:14px; flex-shrink:0;
  }
  .company-block.open .chevron-edit{transform:rotate(90deg);}
  .company-edit-body{
    display:none;
  }
  .company-block.open .company-edit-body{
    display:block;
  }
  .company-info-edit{padding-bottom:6px;}
  .collapsible-body{
    overflow:hidden; max-height:0;
    transition:max-height .3s cubic-bezier(.4,0,.2,1);
  }
  .home-list-divider{height:1.5px; background:var(--green-pale); margin:16px 0 4px; border-radius:2px;}

  .setup-banner{
    background:var(--orange-pale); border:1.5px solid #FFD9B8; border-radius:14px; padding:14px; margin-bottom:14px; font-size:12.5px; line-height:1.7;
  }
  .setup-banner b{color:var(--orange-deep);}

  /* モーダル */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(40,60,40,.45); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{ background:#fff; border-radius:20px; padding:22px; max-width:340px; width:100%; }
  .modal-box p{font-size:14px; line-height:1.6; margin:0 0 16px; font-weight:500;}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{ flex:1; padding:11px 0; border-radius:999px; font-size:13.5px; font-weight:700; border:none; cursor:pointer; font-family:inherit; }
  .modal-cancel{background:#EFF1EA; color:#6B6F64;}
  .modal-confirm{background:var(--red); color:#fff;}

  .modal-ok{background:var(--green); color:#fff;}
  .pw-input{ width:100%; box-sizing:border-box; padding:12px 16px; font-size:16px; border:2px solid var(--green-pale); border-radius:999px; outline:none; font-family:inherit; margin-bottom:8px; }
  .pw-input:focus{ border-color:var(--green); }
  .pw-err{ color:var(--red); font-size:12.5px; min-height:18px; margin-bottom:8px; }
  .form-group-title{ font-size:12.5px; font-weight:800; color:var(--green-deep); margin:18px 0 2px; padding-left:2px; }
  .form-group-title:first-child{ margin-top:4px; }
  .form-hint{ font-size:11.5px; color:var(--textsub); line-height:1.6; margin:2px 0 6px; }
  .lock-ic{ font-size:15px; }
  .admin-overlay{ display:none; position:fixed; inset:0; z-index:90; background:var(--bg,#F7F8F2); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .admin-overlay.show{ display:block; }
  .admin-head{ position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; padding:16px; background:var(--green); color:#fff; border-radius:0 0 20px 20px; box-shadow:0 2px 10px rgba(47,169,102,.28); }
  .admin-head h2{ margin:0; font-size:17px; font-weight:800; }
  .admin-head button{ font-family:inherit; font-size:12px; font-weight:700; color:var(--green-deep); background:#fff; border:none; border-radius:999px; padding:7px 16px; }
  .admin-body{ padding:16px; }
  .admin-card{ background:#fff; border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
  .admin-card .an{ font-weight:800; color:var(--green-deep); font-size:14.5px; }
  .admin-card .ap{ margin-top:6px; font-size:15px; font-family:ui-monospace,Menlo,monospace; letter-spacing:.5px; word-break:break-all; }
  .admin-card .ap.none{ font-family:inherit; color:#AEB2A8; font-size:12.5px; letter-spacing:0; }
  .toast{
    position:fixed; bottom:94px; left:50%; transform:translateX(-50%);
    background:var(--green-deep); color:#fff; padding:10px 20px; border-radius:999px; font-size:13px; font-weight:700;
    z-index:200; opacity:0; transition:opacity .25s; pointer-events:none;
    box-shadow:0 3px 10px rgba(31,138,79,.4);
  }
  .toast.show{opacity:1;}

#authGate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#E8F7EE,#FFF3E8);display:flex;align-items:center;justify-content:center;padding:24px;font-family:"M PLUS Rounded 1c",sans-serif}
#authGate .box{background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center}
#authGate h2{margin:0 0 6px;font-size:20px;color:#2FA966}
#authGate p{margin:0 0 16px;font-size:13px;color:#777}
#authGate input{width:100%;box-sizing:border-box;padding:13px 16px;font-size:16px;border:2px solid #cfe9db;border-radius:999px;outline:none;text-align:center;font-family:inherit}
#authGate input:focus{border-color:#2FA966}
#authGate button{margin-top:14px;width:100%;padding:13px;font-size:16px;font-weight:700;color:#fff;background:#FF8A3B;border:none;border-radius:999px;font-family:inherit}
#authErr{color:#e03b3b;font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<div id="authGate"><div class="box"><h2>🏠 空室情報</h2><p>パスワードを入力してください</p><input type="password" id="authInput" autocomplete="current-password" placeholder="パスワード"><button id="authBtn" type="button">開く</button><div id="authErr"></div></div></div>

<header>
  <h1>🏡 グループホーム空室情報</h1>
  <div class="sub-row">
    <div class="sub"><span class="dot" id="connDot"></span><span id="headerSub">読み込み中…</span></div>
    <button id="adminBtn" class="refresh-btn" title="管理者モード">🔑 管理者モード</button>
  </div>
</header>

<div class="screen active" id="screen-top">
  <div class="sort-bar">
    <button class="sort-btn" data-sort="alpha">アルファベット順</button>
    <button class="sort-btn" data-sort="updated">更新日時順</button>
  </div>
  <div id="topList"></div>
</div>

<div class="screen" id="screen-board">
  <div class="edit-section">
    <button class="btn" id="toggleAddPostBtn">＋投稿する</button>
    <div class="collapsible-body" id="addPostBody">
      <label>法人名</label>
      <select id="postCompany"></select>
      <label>担当者名</label>
      <input type="text" id="postAuthor">
      <label>本文</label>
      <textarea id="postText" placeholder="皆に伝えたいことを入力"></textarea>
      <button class="btn" id="addPostBtn">投稿する</button>
    </div>
  </div>
  <div id="boardList"></div>
</div>

<div class="screen" id="screen-edit">

  <div class="edit-section">
    <button class="btn" id="toggleAddCompanyBtn">＋法人を追加</button>
    <div class="collapsible-body" id="addCompanyBody">
      <div class="form-group-title">基本情報</div>
      <label>法人名（必須）</label>
      <input type="text" id="newCompanyName" placeholder="例：会社A">
      <label>本社住所（任意）</label>
      <input type="text" id="newCompanyAddress" placeholder="例：埼玉県草加市〇〇1-2-3">
      <label>代表（問い合わせ先）電話番号</label>
      <input type="text" id="newCompanyPhone" placeholder="例：048-000-0000" inputmode="tel">
      <label>担当者</label>
      <input type="text" id="newCompanyContact">
      <div class="form-group-title">🔒 編集パスワード（必須）</div>
      <div class="form-hint">この法人の情報を編集するときに必要です。忘れた場合は管理者が確認できます。</div>
      <input type="text" id="newCompanyPassword" placeholder="4文字以上" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" id="addCompanyBtn" style="margin-top:16px;">登録</button>
    </div>
  </div>

  <h3 class="section-label">【法人リスト】</h3>
  <div id="companyEditList"></div>

</div>

<div class="tabs">
  <div class="tab active" data-screen="top"><span class="ic">🏠</span>トップ</div>
  <div class="tab" data-screen="board"><span class="ic">📝</span>一言掲示板</div>
  <div class="tab" data-screen="edit"><span class="ic">⚙️</span>編集</div>
</div>

<button id="scrollTopBtn" class="scroll-top-btn" title="上に戻る">▲</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <p id="modalText">削除しますか？</p>
    <div class="modal-actions">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
(function(){
  "use strict";
  const LOCAL_CACHE_KEY = "gh_vacancy_cache_fb1";
  // ↓ Firebaseコンソールの「firebaseConfig」をここに貼り付けます
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBsxQDm-vGmfoOMo9vvihDOH9wAI1BWBvc",
    authDomain: "soka-gh.firebaseapp.com",
    projectId: "soka-gh",
    storageBucket: "soka-gh.firebasestorage.app",
    messagingSenderId: "196752144378",
    appId: "1:196752144378:web:33b5b9f6016ba1bef91643"
  };
  // 共通パスワードでログインするための固定メールアドレス（Firebaseコンソールで同じものを登録）
  const LOGIN_EMAIL = "roomcheck@example.com";
  const CONFIG_OK = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
  let db = null, auth = null;
  // 無操作でログイン画面に戻るまでの時間（分）
  const IDLE_MINUTES = 15;

  let data = { companies: [], homes: [], posts: [] };
  let openCompanyIds = new Set();
  let openEditCompanyIds = new Set();
  // この端末で今回ログイン中にパスワードを入力して開いた法人（法人ID → パスワード）
  const unlockedCompanies = new Map();
  const ADMIN_HASH = "aa217457324bfec5c378be63b53136460d14fc88a8f9cc9a33d9d04495cfa8df";
  let openEditHomeIds = new Set(); // 編集画面のホーム項目の開閉状態（デフォルト全て閉）
  let openEditPostIds = new Set(); // 編集中の投稿ID
  let draftHomes = []; // 登録ボタンを押すまで保存されない新規ホームの仮データ
  let sortMode = localStorage.getItem("gh_sort_mode") || "alpha";
  if(sortMode !== "alpha" && sortMode !== "updated") sortMode = "alpha";
  const collatorJa = new Intl.Collator("ja");

  // タップ操作でフォーカスが移動し、ブラウザが自動スクロールするより前の
  // スクロール位置を記録しておく（click発火時には既に動いてしまっている事があるため）
  let preTapScrollY = window.scrollY;
  ["touchstart", "pointerdown", "mousedown"].forEach(evt=>{
    document.addEventListener(evt, ()=>{ preTapScrollY = window.scrollY; }, { passive: true, capture: true });
  });

  // 再描画でページが先頭に飛ばないよう、スクロール位置を一定時間しつこく復元する
  function restoreScrollRepeatedly(scrollY){
    const restore = () => {
      if(Math.abs(window.scrollY - scrollY) > 2) window.scrollTo(0, scrollY);
    };
    restore();
    requestAnimationFrame(restore);
    setTimeout(restore, 60);
    setTimeout(restore, 200);
    setTimeout(restore, 400);
  }

  function preserveScroll(renderFn){
    const scrollY = preTapScrollY;
    renderFn();
    restoreScrollRepeatedly(scrollY);
  }

  // 法人ブロックなど、再描画後も存在し続ける要素を基準に
  // 「その要素が画面上の同じ位置に留まる」ようスクロールを補正する。
  // フォーカス移動などブラウザ側の予期しない自動スクロールにも対応できる。
  function preserveScrollAnchoredTo(selector, renderFn){
    const ref = document.querySelector(selector);
    const beforeTop = ref ? ref.getBoundingClientRect().top : null;
    renderFn();
    if(beforeTop === null) return;
    const restore = () => {
      const newRef = document.querySelector(selector);
      if(!newRef) return;
      const diff = newRef.getBoundingClientRect().top - beforeTop;
      if(Math.abs(diff) > 1) window.scrollBy(0, diff);
    };
    restore();
    requestAnimationFrame(restore);
    setTimeout(restore, 60);
    setTimeout(restore, 200);
    setTimeout(restore, 400);
  }

  // ホームの人数・増減を編集保存した時に、その法人の更新日時を記録する
  function touchCompanyUpdated(companyId){
    const company = data.companies.find(c=>c.id === companyId);
    if(!company) return;
    company.updatedAt = Date.now();
    dbWrite({action:"updateCompany", id: company.id, name: company.name, phone: company.phone || "", contactPerson: company.contactPerson || "", updatedAt: company.updatedAt, contacts: JSON.stringify(company.contacts || [])});
  }

  function vacancyOf(companyId){
    return data.homes.filter(h=>String(h.companyId) === String(companyId))
      .reduce((s,h)=> s + Math.max(h.capacity - h.count, 0), 0);
  }
  function getSortedCompanies(){
    const list = [...data.companies];
    if(sortMode === "updated"){
      // 最終更新が新しい順（更新履歴のない法人は最後にアルファベット順）
      list.sort((a,b)=> (Number(b.updatedAt)||0) - (Number(a.updatedAt)||0) || collatorJa.compare(a.name, b.name));
    } else {
      list.sort((a,b)=> collatorJa.compare(a.name, b.name));
    }
    return list;
  }
  function updateSortBtns(){
    document.querySelectorAll(".sort-btn").forEach(b=>{
      b.classList.toggle("active", b.dataset.sort === sortMode);
    });
  }
  document.querySelectorAll(".sort-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      sortMode = b.dataset.sort;
      localStorage.setItem("gh_sort_mode", sortMode);
      updateSortBtns();
      renderTop();
    });
  });

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function escapeHtml(str){
    if(str === undefined || str === null) return "";
    return String(str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function formatDate(ts){
    const d = new Date(Number(ts));
    const pad = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function parseContactsJson(raw){
    if(Array.isArray(raw)) return raw;
    if(!raw) return [];
    try{
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      return [];
    }
  }
  function contactChipHtml(phone, contactPerson){
    if(!phone && !contactPerson) return "";
    const phoneHtml = phone
      ? `<a href="tel:${escapeHtml(String(phone).replace(/[^0-9+]/g,""))}" onclick="event.stopPropagation()">☎ ${escapeHtml(phone)}</a>`
      : "";
    const personHtml = contactPerson ? escapeHtml(contactPerson) : "";
    let inner;
    if(phoneHtml && personHtml) inner = `${phoneHtml}（${personHtml}）`;
    else if(phoneHtml) inner = phoneHtml;
    else inner = personHtml;
    return `<span class="contact-chip">${inner}</span>`;
  }

  // ---------- トースト ----------
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=> t.classList.remove("show"), 1600);
  }

  // ---------- 確認モーダル ----------
  let pendingConfirmAction = null;
  function askConfirm(message, onConfirm){
    document.getElementById("modalText").textContent = message;
    pendingConfirmAction = onConfirm;
    document.getElementById("modalOverlay").classList.add("show");
  }
  document.getElementById("modalCancel").addEventListener("click", ()=>{
    document.getElementById("modalOverlay").classList.remove("show");
    pendingConfirmAction = null;
  });
  document.getElementById("modalConfirm").addEventListener("click", ()=>{
    document.getElementById("modalOverlay").classList.remove("show");
    if(pendingConfirmAction) pendingConfirmAction();
    pendingConfirmAction = null;
  });

  // ---------- 接続状態表示 ----------
  function setConnStatus(state, label){
    const dot = document.getElementById("connDot");
    dot.className = "dot " + state;
    document.getElementById("headerSub").textContent = label;
  }

  // ---------- Firestore 書き込み ----------
  function clean_(obj){
    const o = {};
    Object.keys(obj).forEach(k=>{ if(obj[k] !== undefined) o[k] = obj[k]; });
    return o;
  }
  function dbWrite(p){
    if(!db) return Promise.resolve();
    const col = n => db.collection(n);
    let task;
    switch(p.action){
      case "addCompany":
      case "updateCompany": {
        let contacts = p.contacts;
        if(typeof contacts === "string"){ try{ contacts = JSON.parse(contacts); }catch(e){ contacts = []; } }
        task = col("companies").doc(String(p.id)).set(clean_({
          id: p.id, name: p.name, address: p.address === undefined ? undefined : String(p.address),
          phone: p.phone || "", contactPerson: p.contactPerson || "",
          updatedAt: Number(p.updatedAt) || null, contacts: Array.isArray(contacts) ? contacts : [],
          hasPassword: p.hasPassword === true ? true : undefined
        }), {merge:true});
        break;
      }
      case "setCompanyPassword":
        task = col("companyPasswords").doc(String(p.id)).set({id: String(p.id), password: String(p.password)});
        break;
      case "deleteCompany": {
        task = col("homes").where("companyId","==",String(p.id)).get().then(snap=>{
          const batch = db.batch();
          snap.forEach(d=> batch.delete(d.ref));
          batch.delete(col("companies").doc(String(p.id)));
          batch.delete(col("companyPasswords").doc(String(p.id)));
          return batch.commit();
        });
        break;
      }
      case "addHome":
      case "updateHome": {
        task = col("homes").doc(String(p.id)).set(clean_({
          id: p.id, companyId: String(p.companyId), name: p.name, gender: p.gender,
          capacity: Number(p.capacity) || 0, count: Number(p.count) || 0,
          notes: p.notes || "", postalCode: p.postalCode || "", address: p.address || "",
          homeType: p.homeType || "", buildingName: p.buildingName || ""
        }), {merge:true});
        break;
      }
      case "deleteHome":
        task = col("homes").doc(String(p.id)).delete(); break;
      case "addPost":
        task = col("posts").doc(String(p.id)).set(clean_({
          id: p.id, companyId: String(p.companyId), author: p.author || "", text: p.text || "", timestamp: Number(p.timestamp) || Date.now()
        })); break;
      case "updatePost":
        task = col("posts").doc(String(p.id)).set({author: p.author || "", text: p.text || ""}, {merge:true}); break;
      case "deletePost":
        task = col("posts").doc(String(p.id)).delete(); break;
      default:
        return Promise.resolve();
    }
    const slowTimer = setTimeout(()=> showToast("サーバーに届いていません。通信状況を確認してください"), 8000);
    return task.then(()=>{ clearTimeout(slowTimer); }).catch(err=>{
      clearTimeout(slowTimer);
      console.error(err);
      showToast("保存に失敗しました（" + ((err && err.code) || "不明") + "）");
    });
  }

  // ---------- データ更新フロー ----------
  function saveLocalCache(){
    try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data)); }catch(e){}
  }
  function loadLocalCache(){
    try{
      const raw = localStorage.getItem(LOCAL_CACHE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d && d.companies && d.homes && d.posts) data = d;
      }
    }catch(e){}
  }

  const snapStore = { companies: null, homes: null, posts: null };
  function normalizeCompany(c){
    return {...c, updatedAt: Number(c.updatedAt) || null, contacts: Array.isArray(c.contacts) ? c.contacts : parseContactsJson(c.contacts)};
  }
  function applySnapshots(){
    if(!snapStore.companies || !snapStore.homes || !snapStore.posts) return;
    const next = {
      companies: snapStore.companies.map(normalizeCompany),
      homes: snapStore.homes.map(h=>({...h, companyId:String(h.companyId), capacity:Number(h.capacity)||0, count:Number(h.count)||0})),
      posts: snapStore.posts.map(p=>({...p, companyId:String(p.companyId), timestamp:Number(p.timestamp)||0}))
    };
    const changed = JSON.stringify(next) !== JSON.stringify(data);
    data = next;
    enforcePostLimit().forEach(p=> dbWrite({action:"deletePost", id:p.id}));
    saveLocalCache();
    setConnStatus("ok", "データベースと連携中");
    if(!changed) return;
    // 入力中は画面を作り直さない（入力が消えるのを防ぐ）
    const ae = document.activeElement;
    if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    renderCurrentScreen();
  }
  let unsubscribers = [];
  function startRealtime(){
    unsubscribers.forEach(u=>u());
    unsubscribers = [];
    ["companies","homes","posts"].forEach(name=>{
      const u = db.collection(name).onSnapshot(snap=>{
        snapStore[name] = snap.docs.map(d=> ({...d.data(), id: d.id}));
        applySnapshots();
      }, err=>{
        console.error(err);
        setConnStatus("err", "接続エラー：" + ((err && err.code) || "不明"));
      });
      unsubscribers.push(u);
    });
  }

  // 画面は常に自動で最新になるため、silent=true の呼び出しは何もしない
  function refreshFromSheet(silent){
    if(silent || !db) return Promise.resolve();
    setConnStatus("busy", "更新中…");
    return Promise.all(["companies","homes","posts"].map(n=>
      db.collection(n).get({source:"server"}).then(snap=>{ snapStore[n] = snap.docs.map(d=>({...d.data(), id:d.id})); })
    )).then(()=>{
      applySnapshots();
    }).catch(()=>{
      setConnStatus("err", "接続に失敗しました（キャッシュ表示中）");
    });
  }

  function renderCurrentScreen(){
    const activeTab = document.querySelector(".tab.active");
    const screen = activeTab ? activeTab.dataset.screen : "top";
    if(screen === "top") renderTop();
    if(screen === "board") renderBoard();
    if(screen === "edit") renderEdit();
  }

  // ---------- タブ切り替え ----------
  function switchToTab(screenName){
    document.querySelectorAll(".tab").forEach(t=> t.classList.toggle("active", t.dataset.screen === screenName));
    document.querySelectorAll(".screen").forEach(s=> s.classList.toggle("active", s.id === "screen-"+screenName));
    renderCurrentScreen();
    refreshFromSheet(true);
  }
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=> switchToTab(tab.dataset.screen));
  });

  // ================= トップ画面 =================
  function renderTop(){
    const scrollY = window.scrollY;
    updateSortBtns();
    const list = document.getElementById("topList");
    if(data.companies.length === 0){
      list.innerHTML = `<div class="empty-msg">法人が登録されていません。<br>「編集」タブから法人を追加してください。</div>`;
      restoreScrollRepeatedly(scrollY);
      return;
    }
    list.innerHTML = getSortedCompanies().map(c=>{
      const homes = data.homes.filter(h=>String(h.companyId) === String(c.id));
      const vacantTotal = homes.reduce((s,h)=> s + Math.max(h.capacity - h.count, 0), 0);
      const isOpen = openCompanyIds.has(c.id);
      const contactChips = [
        contactChipHtml(c.phone, c.contactPerson),
        ...(c.contacts || []).map(ct=> contactChipHtml(ct.phone, ct.contactPerson))
      ].filter(Boolean);
      const homesHtml = homes.length === 0
        ? `<div class="home-row"><span class="small-gray">ホームが登録されていません</span></div>`
        : homes.map(h=>{
            const remain = h.capacity - h.count;
            const full = remain <= 0;
            const genderClass = h.gender === "male" ? "gender-male" : h.gender === "female" ? "gender-female" : "gender-any";
            const genderLabel = h.gender === "male" ? "男性" : h.gender === "female" ? "女性" : "男女";
            const addressLine = [h.postalCode ? `〒${h.postalCode}` : "", h.address || ""].filter(Boolean).join(" ");
            return `
              <div class="home-row">
                <div class="home-row-top">
                  <div class="home-left">
                    <div class="home-badges">
                      <span class="gender-badge ${genderClass}">${genderLabel}</span>
                      ${h.homeType ? `<span class="type-badge">${escapeHtml(h.homeType)}</span>` : ""}
                    </div>
                    <div class="home-name">${escapeHtml(h.name)}</div>
                  </div>
                  <div>
                    <span class="status-pill ${full ? "status-full" : "status-vacant"}">${full ? "満室" : "空室"}</span>
                    <span class="home-count">${h.count}／${h.capacity}名</span>
                  </div>
                </div>
                ${addressLine ? `<div class="home-address">📍 ${escapeHtml(addressLine)}</div>` : ""}
                ${h.buildingName ? `<div class="home-address home-building">${escapeHtml(h.buildingName)}</div>` : ""}
                ${h.notes ? `<div class="home-notes">${escapeHtml(h.notes)}</div>` : ""}
              </div>`;
          }).join("");
      return `
        <div class="company-card ${isOpen ? "open" : ""}" data-company-id="${c.id}">
          <div class="company-head" data-action="toggle-company" data-id="${c.id}">
            <div>
              <div class="company-name">${escapeHtml(c.name)}</div>
              <div class="company-vacancy">空き <b>${vacantTotal}</b> 室</div>
              ${homes.filter(h=> h.capacity - h.count > 0).map(h=>`<div class="company-vacant-home">${escapeHtml(h.name)}　<b>${h.capacity - h.count}</b>室</div>`).join("")}
              ${c.updatedAt ? `<div class="company-updated">最終更新：${formatDate(c.updatedAt)}</div>` : ""}
            </div>
            <div class="chevron">▶</div>
          </div>
          <div class="home-list" data-home-list>
            ${contactChips.length ? `<div class="contact-label contact-chips-inset">問い合わせ先</div><div class="contact-chips">${contactChips.join("")}</div>` : ""}
            ${homesHtml}
          </div>
        </div>`;
    }).join("");
    // 開閉アニメーション用に max-height を設定
    document.querySelectorAll("#topList .company-card").forEach(card=>{
      const listEl = card.querySelector("[data-home-list]");
      if(card.classList.contains("open")){
        listEl.style.maxHeight = listEl.scrollHeight + "px";
      } else {
        listEl.style.maxHeight = "0px";
      }
    });
    restoreScrollRepeatedly(scrollY);
  }

  document.getElementById("topList").addEventListener("click", (e)=>{
    const head = e.target.closest("[data-action='toggle-company']");
    if(!head) return;
    const id = head.dataset.id;
    const card = head.closest(".company-card");
    const listEl = card.querySelector("[data-home-list]");
    const opening = !card.classList.contains("open");

    if(opening){
      openCompanyIds.add(id);
      card.classList.add("open");
      listEl.style.maxHeight = listEl.scrollHeight + "px";
    } else {
      openCompanyIds.delete(id);
      // 現在の高さを明示してからアニメーションで0へ
      listEl.style.maxHeight = listEl.scrollHeight + "px";
      card.classList.remove("open");
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          listEl.style.maxHeight = "0px";
        });
      });
    }
  });

  // ================= 掲示板画面 =================
  function renderBoard(){
    const scrollY = window.scrollY;
    renderCompanySelect();
    const list = document.getElementById("boardList");
    const sorted = [...data.posts].sort((a,b)=> b.timestamp - a.timestamp);
    if(sorted.length === 0){
      list.innerHTML = `<div class="empty-msg">投稿はまだありません。</div>`;
      restoreScrollRepeatedly(scrollY);
      return;
    }
    list.innerHTML = sorted.map(p=>{
      const company = data.companies.find(c=>String(c.id) === String(p.companyId));
      const companyName = company ? company.name : "（法人不明）";
      if(openEditPostIds.has(p.id)){
        return `
          <div class="board-post" data-post-id="${p.id}">
            <div class="board-meta">
              <span class="board-company">${escapeHtml(companyName)}</span>
              <span class="board-date">${formatDate(p.timestamp)}</span>
            </div>
            <label>担当者</label>
            <input type="text" data-field="post-author" data-id="${p.id}" value="${escapeHtml(p.author)}">
            <label>本文</label>
            <textarea data-field="post-text" data-id="${p.id}">${escapeHtml(p.text)}</textarea>
            <div class="post-edit-row">
              <button class="icon-btn" data-action="cancel-edit-post" data-id="${p.id}">キャンセル</button>
              <button class="icon-btn" data-action="save-post" data-id="${p.id}">保存</button>
            </div>
          </div>`;
      }
      return `
        <div class="board-post" data-post-id="${p.id}">
          <div class="board-meta">
            <span class="board-company">${escapeHtml(companyName)}</span>
            <span class="board-author-top">担当：${escapeHtml(p.author || "（未入力）")}</span>
          </div>
          <div class="board-text">${escapeHtml(p.text)}</div>
          <div class="board-date-bottom">${formatDate(p.timestamp)}</div>
          <div class="post-edit-row">
            <button class="icon-btn" data-action="edit-post" data-id="${p.id}">編集</button>
            <button class="icon-btn danger" data-action="del-post" data-id="${p.id}">削除</button>
          </div>
        </div>`;
    }).join("");
    restoreScrollRepeatedly(scrollY);
  }

  document.getElementById("boardList").addEventListener("click", (e)=>{
    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if(action === "edit-post"){
      openEditPostIds.add(id);
      preserveScroll(renderBoard);
      return;
    }

    if(action === "cancel-edit-post"){
      openEditPostIds.delete(id);
      preserveScroll(renderBoard);
      return;
    }

    if(action === "save-post"){
      const item = btn.closest("[data-post-id]");
      const author = item.querySelector("[data-field='post-author']").value.trim();
      const text = item.querySelector("[data-field='post-text']").value.trim();
      if(!text){ showToast("本文を入力してください"); return; }
      const post = data.posts.find(p=>p.id === id);
      if(post){
        post.author = author;
        post.text = text;
        saveLocalCache();
        openEditPostIds.delete(id);
        preserveScroll(renderBoard);
        showToast("保存しました");
        dbWrite({action:"updatePost", id, author, text})
          .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
      }
      return;
    }

  // ---------- 電話番号の自動ハイフン ----------
  function formatPhone(raw){
    const d = String(raw).replace(/[０-９]/g, c=> String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\D/g, "").slice(0, 11);
    if(!d) return "";
    let groups;
    if(d.startsWith("0120") || d.startsWith("0800")) groups = [4, 3, 3];   // フリーダイヤル
    else if(/^(050|070|080|090)/.test(d)) groups = [3, 4, 4];               // 携帯・IP電話
    else if(/^(03|06)/.test(d)) groups = [2, 4, 4];                        // 東京・大阪
    else groups = [3, 3, 4];                                                // 048 など
    const parts = [];
    let i = 0;
    for(const g of groups){
      if(i >= d.length) break;
      parts.push(d.slice(i, i + g));
      i += g;
    }
    return parts.join("-");
  }
  document.addEventListener("input", e=>{
    const el = e.target;
    if(!el || el.tagName !== "INPUT" || el.getAttribute("inputmode") !== "tel") return;
    if(e.isComposing) return;
    const before = el.value;
    const caret = el.selectionStart;
    const digitsBeforeCaret = before.slice(0, caret).replace(/\D/g, "").length;
    const formatted = formatPhone(before);
    if(formatted === before) return;
    el.value = formatted;
    // 入力位置（数字の個数）を保ったままカーソルを戻す
    let pos = 0, count = 0;
    while(pos < formatted.length && count < digitsBeforeCaret){
      if(/\d/.test(formatted[pos])) count++;
      pos++;
    }
    if(caret >= before.length) pos = formatted.length;
    try{ el.setSelectionRange(pos, pos); }catch(err){}
  });

  // ---------- パスワード入力ダイアログ ----------
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  // validate(入力値) が true を返せば成功。キャンセルなら false を返す
  function askPassword(title, validate){
    return new Promise(resolve=>{
      const ov = document.getElementById("pwOverlay");
      const input = document.getElementById("pwInput");
      const err = document.getElementById("pwErr");
      const ok = document.getElementById("pwOk");
      const cancel = document.getElementById("pwCancel");
      document.getElementById("pwTitle").textContent = title;
      input.value = ""; err.textContent = "";
      ov.classList.add("show");
      setTimeout(()=>input.focus(), 60);
      let busy = false;
      function close(result){
        ov.classList.remove("show");
        ok.onclick = cancel.onclick = input.onkeydown = null;
        resolve(result);
      }
      async function submit(){
        if(busy) return;
        busy = true; ok.disabled = true; err.textContent = "";
        let good = false;
        try{
          good = await validate(input.value);
        }catch(e){
          err.textContent = "確認できませんでした。通信状況を確認してください";
          busy = false; ok.disabled = false;
          return;
        }
        busy = false; ok.disabled = false;
        if(good){ close(true); }
        else{ err.textContent = "パスワードが違います"; input.value = ""; input.focus(); }
      }
      ok.onclick = submit;
      cancel.onclick = ()=> close(false);
      input.onkeydown = e=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); } };
    });
  }

      const snap = await db.collection("companyPasswords").doc(String(id)).get();
      const real = snap.exists ? String(snap.data().password || "") : "";
      if(real && v === real){ unlockedCompanies.set(id, real); return true; }
      return false;
    });
  }

  // 一言掲示板の投稿は最大15件まで。超えた分は古いものから自動的に削除する
  const MAX_BOARD_POSTS = 15;
  function enforcePostLimit(){
    if(data.posts.length <= MAX_BOARD_POSTS) return [];
    const sortedAsc = [...data.posts].sort((a,b)=> a.timestamp - b.timestamp);
    const overflow = sortedAsc.length - MAX_BOARD_POSTS;
    const removed = sortedAsc.slice(0, overflow);
    const removeIds = new Set(removed.map(p=>p.id));
    data.posts = data.posts.filter(p=>!removeIds.has(p.id));
    return removed;
  }

  document.getElementById("screen-edit").addEventListener("click", (e)=>{
    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

      const company = data.companies.find(c=>c.id === id);
      const pwEl = block.querySelector("[data-field='company-password']");
      const newPw = pwEl ? pwEl.value.trim() : "";

      if(newPw && newPw.length < 4){ showToast("編集パスワードは4文字以上にしてください"); return; }
      if(company){
        const pwChanged = !!newPw && newPw !== (unlockedCompanies.get(id) || "");

        company.name = name;

        company.phone = phone;

      const company = data.companies.find(c=>c.id === id);
      if(!company) return;
      if(!company.contacts) company.contacts = [];
      company.contacts.push({ id: uid(), phone: "", contactPerson: "" });
      preserveScrollAnchoredTo(`.company-block[data-company-id="${id}"]`, renderEdit);
      return;
    }

    if(action === "del-contact"){
      const companyId = btn.dataset.companyId;
      const company = data.companies.find(c=>c.id === companyId);
      if(!company) return;
      company.contacts = (company.contacts || []).filter(ct=>ct.id !== id);
      preserveScrollAnchoredTo(`.company-block[data-company-id="${companyId}"]`, renderEdit);
      return;
    }

    if(action === "toggle-company-edit"){
      const block = btn.closest(".company-block");
      const opening = !block.classList.contains("open");
      if(opening){
        const comp = data.companies.find(x=>x.id === id);
        if(!comp || !comp.hasPassword || unlockedCompanies.has(id)){
          // パスワード不要（または入力済み）の法人は、これまで通りその場で開く
          openEditCompanyIds.add(id);
          block.classList.add("open");
        } else {
          unlockCompany(id).then(ok=>{
            if(!ok) return;
            openEditCompanyIds.add(id);
            preserveScrollAnchoredTo(`.company-block[data-company-id="${id}"]`, renderEdit);
          });
        }
      } else {
        openEditCompanyIds.delete(id);
        block.classList.remove("open");
      }
      return;
    }

    if(action === "toggle-home-edit"){
      const item = btn.closest(".home-edit-item");
      const opening = !item.classList.contains("open");
      if(opening){
        openEditHomeIds.add(id);
        item.classList.add("open");
      } else {
        openEditHomeIds.delete(id);
        item.classList.remove("open");
      }
      return;
    }

    if(action === "add-home"){
      draftHomes.push({ tempId: uid(), companyId: id, name: "", gender: "male", capacity: 1, count: 0, notes: "", postalCode: "", address: "", homeType: "", buildingName: "" });
      preserveScrollAnchoredTo(`.company-block[data-company-id="${id}"]`, renderEdit);
      return;
    }

    if(action === "confirm-new-home"){
      const item = btn.closest("[data-temp-id]");
      const name = item.querySelector("[data-field='name']").value.trim() || "新しいホーム";
      const gender = item.querySelector("[data-field='gender']").value;
      const homeType = item.querySelector("[data-field='homeType']").value;
      const capacity = Math.max(0, parseInt(item.querySelector("[data-field='capacity']").value, 10) || 0);
      const count = Math.max(0, parseInt(item.querySelector("[data-field='count']").value, 10) || 0);
      const notes = item.querySelector("[data-field='notes']").value.trim();
      const postalCode = item.querySelector("[data-field='postalCode']").value.trim();
      const address = item.querySelector("[data-field='address']").value.trim();
      const buildingName = item.querySelector("[data-field='buildingName']").value.trim();
      const draft = draftHomes.find(d=>d.tempId === id);
      if(!draft) return;
      const newHome = { id: uid(), companyId: draft.companyId, name, gender, capacity, count, notes, postalCode, address, homeType, buildingName };
      data.homes.push(newHome);
      draftHomes = draftHomes.filter(d=>d.tempId !== id);
      openEditHomeIds.add(newHome.id);
      touchCompanyUpdated(draft.companyId);
      saveLocalCache();
      preserveScrollAnchoredTo(`.company-block[data-company-id="${draft.companyId}"]`, ()=>{ renderEdit(); renderTop(); });
      showToast("ホームを登録しました");
      dbWrite({action:"addHome", ...newHome})
        .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
      return;
    }

    if(action === "cancel-new-home"){
      const draft = draftHomes.find(d=>d.tempId === id);
      const companyId = draft ? draft.companyId : null;
      draftHomes = draftHomes.filter(d=>d.tempId !== id);
      if(companyId){
        preserveScrollAnchoredTo(`.company-block[data-company-id="${companyId}"]`, renderEdit);
      } else {
        preserveScroll(renderEdit);
      }
      return;
    }

    if(action === "save-home"){
      const item = btn.closest("[data-home-id]");
      const home = data.homes.find(h=>h.id === id);
      if(!home) return;
      home.name = item.querySelector("[data-field='name']").value.trim() || home.name;
      home.gender = item.querySelector("[data-field='gender']").value;
      home.homeType = item.querySelector("[data-field='homeType']").value;
      home.capacity = Math.max(0, parseInt(item.querySelector("[data-field='capacity']").value, 10) || 0);
      home.count = Math.max(0, parseInt(item.querySelector("[data-field='count']").value, 10) || 0);
      home.notes = item.querySelector("[data-field='notes']").value.trim();
      home.postalCode = item.querySelector("[data-field='postalCode']").value.trim();
      home.address = item.querySelector("[data-field='address']").value.trim();
      home.buildingName = item.querySelector("[data-field='buildingName']").value.trim();
      touchCompanyUpdated(home.companyId);
      saveLocalCache();
      preserveScrollAnchoredTo(`.company-block[data-company-id="${home.companyId}"]`, ()=>{ renderEdit(); renderTop(); });
      showToast("保存しました");
      dbWrite({action:"updateHome", id: home.id, companyId: home.companyId, name: home.name, gender: home.gender, capacity: home.capacity, count: home.count, notes: home.notes, postalCode: home.postalCode, address: home.address, homeType: home.homeType, buildingName: home.buildingName})
        .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
      return;
    }

    if(action === "del-home"){
      askConfirm("このホームを削除しますか？", ()=>{
        const removedHome = data.homes.find(h=>h.id === id);
        data.homes = data.homes.filter(h=>h.id !== id);
        if(removedHome) touchCompanyUpdated(removedHome.companyId);
        saveLocalCache();
        if(removedHome){
          preserveScrollAnchoredTo(`.company-block[data-company-id="${removedHome.companyId}"]`, renderEdit);
        } else {
          preserveScroll(renderEdit);
        }
        showToast("削除しました");
        dbWrite({action:"deleteHome", id})
          .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
      });
      return;
    }

    if(action === "del-company"){
      const delTarget = data.companies.find(c=>c.id === id);
      const delName = delTarget && delTarget.name ? delTarget.name : "この法人";
      askConfirm(`「${delName}」と、所属するホームをすべて削除しますか？`, ()=>{
        data.companies = data.companies.filter(c=>c.id !== id);
        data.homes = data.homes.filter(h=>String(h.companyId) !== String(id));
        saveLocalCache();
        preserveScroll(renderEdit);
        showToast("削除しました");
        dbWrite({action:"deleteCompany", id})
          .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
      });
      return;
    }
  });

  // ※ホーム情報は「保存」「登録」ボタンを押した時にのみ反映されます（自動保存はしません）

  // ---------- 上に戻るボタン ----------
  const scrollTopBtn = document.getElementById("scrollTopBtn");
  window.addEventListener("scroll", ()=>{
    scrollTopBtn.classList.toggle("show", window.scrollY > 250);
  }, { passive: true });
  scrollTopBtn.addEventListener("click", ()=>{
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ---------- 初期表示 ----------
  let started = false;
  let lastActivity = Date.now();
  const LAST_KEY = "gh_last_activity";
  let lastWrite = 0;
  function touchActivity(force){
    lastActivity = Date.now();
    if(force || lastActivity - lastWrite > 5000){
      lastWrite = lastActivity;
      try{ localStorage.setItem(LAST_KEY, String(lastActivity)); }catch(e){}
    }
  }
  // 最後に操作した時刻（アプリを閉じていた間も含めて判定するため端末に保存）
  function lastActiveAt(){
    try{
      const v = Number(localStorage.getItem(LAST_KEY));
      return v > 0 ? v : 0;
    }catch(e){ return lastActivity; }
  }
  function isIdleExpired(){
    return Date.now() - lastActiveAt() >= IDLE_MINUTES * 60 * 1000;
  }
  function stopApp(){
    unlockedCompanies.clear();
    openEditCompanyIds.clear();
    closePwDialog();
    closeAdmin();
    unsubscribers.forEach(u=>u());
    unsubscribers = [];
    snapStore.companies = snapStore.homes = snapStore.posts = null;
    started = false;
  }
  function startApp(){
    if(started) return;
    started = true;
    // 旧バージョン（スプレッドシート版）の端末内データを一度消去し、Firebaseのデータだけを表示する
    try{
      if(!localStorage.getItem("gh_fb_reset_done")){
        ["gh_vacancy_cache_v1","gh_gas_url","gh_auth_ok_v1","gh_vacancy_cache_fb1"].forEach(k=> localStorage.removeItem(k));
        localStorage.setItem("gh_fb_reset_done","1");
      }
    }catch(e){}
    loadLocalCache();
    renderTop();
    setConnStatus("busy", "接続中…");
    startRealtime();
    setTimeout(()=>{
      if(!snapStore.companies || !snapStore.homes || !snapStore.posts){
        setConnStatus("err", "データベースに接続できません（通信環境を確認し「更新」を押してください）");
      }
    }, 10000);
  }

  // ---------- ログイン（Firebase Authentication・共通パスワード） ----------
  function setupAuth(){
    const gate = document.getElementById("authGate");
    const input = document.getElementById("authInput");
    const btn = document.getElementById("authBtn");
    const err = document.getElementById("authErr");

    if(!CONFIG_OK){
      gate.style.display = "flex";
      err.textContent = "Firebaseの設定（firebaseConfig）が未入力です";
      btn.disabled = true;
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
    }catch(e){
      err.textContent = "初期化に失敗しました（" + ((e && e.code) || e) + "）。Safariなど標準のブラウザで開いてください";
      btn.disabled = true;
      return;
    }
    db = firebase.firestore();
    try{ db.settings({experimentalAutoDetectLongPolling: true, merge: true}); }catch(e){}

    async function submit(){
      err.textContent = "";
      btn.disabled = true;
      try{
        touchActivity(true); // ログイン直後に「時間切れ」と誤判定されないよう先に記録
        await auth.signInWithEmailAndPassword(LOGIN_EMAIL, input.value);
        // ログイン状態の通知が来ない環境でも先に進めるよう、成功時に直接開く
        gate.style.display = "none";
        startApp();
      }catch(e){
        const code = e && e.code || "";
        if(code === "auth/network-request-failed") err.textContent = "通信できません。電波を確認してください";
        else if(code === "auth/too-many-requests") err.textContent = "試行回数が多すぎます。しばらくしてからお試しください";
        else err.textContent = "パスワードが違います";
        input.value = "";
        input.focus();
      }
      btn.disabled = false;
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } });

    auth.onAuthStateChanged(user=>{
      if(user){
        // 前回の操作から時間がたっていたら（ホーム画面から開き直した場合なども）ログインし直す
        if(isIdleExpired()){
          auth.signOut();
          return;
        }
        gate.style.display = "none";
        touchActivity(true);
        startApp();
      }else{
        stopApp();
        gate.style.display = "flex";
        input.value = "";
        setTimeout(()=>input.focus(), 100);
      }
    });

    // ---- 無操作タイムアウト ----
    function checkIdle(){
      if(!auth || !auth.currentUser) return;
      if(isIdleExpired()){
        auth.signOut();
      }
    }
    ["touchstart","click","keydown","scroll","mousemove"].forEach(ev=>{
      window.addEventListener(ev, ()=>{ if(auth && auth.currentUser) touchActivity(false); }, {passive:true, capture:true});
    });
    setInterval(checkIdle, 15000);
    // スマホでバックグラウンドから戻った時にも判定する
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkIdle(); });
    window.addEventListener("pageshow", checkIdle);
  }
  setupAuth();
})();
</script>

</body>
</html>
