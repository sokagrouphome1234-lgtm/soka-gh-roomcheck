  @media (max-width:600px){
    header::before{ background-size:100% auto; background-repeat:no-repeat; }
  }
  header > *{ position:relative; z-index:1; }
  header h1{margin:0; font-size:clamp(17px, 5.2vw, 24px); font-weight:800; letter-spacing:.5px; white-space:nowrap; line-height:1.2;}
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .conn-row{margin-top:6px;}
  .sub-row{display:flex; align-items:center; justify-content:space-between; margin-top:3px; gap:10px;}
  header .sub{font-size:11px; opacity:.9; display:flex; align-items:center; gap:6px;}
  .refresh-btn{
    font-size:11px; font-weight:700; color:var(--green-deep); background:#fff; border:none;
    border-radius:999px; padding:5px 12px; cursor:pointer; flex-shrink:0;
    box-shadow:0 1px 3px rgba(0,0,0,.12);
    font-family:inherit;
  }
  .refresh-btn:active{ transform:scale(.96); }
  .refresh-btn.spinning{ opacity:.6; }
  .dot{width:7px; height:7px; border-radius:50%; background:#cfe9da; flex-shrink:0;}
  .dot.ok{background:#4A90E2;}
  .dot.busy{background:#FFD27C;}
  .dot.err{background:#E9573F;}

  .tabs{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff;
    border-top:1px solid var(--line); z-index:60; padding-bottom:env(safe-area-inset-bottom);
  }
  .scroll-top-btn{
    position:fixed; right:16px; bottom:calc(74px + env(safe-area-inset-bottom));
    width:44px; height:44px; border-radius:50%; border:none;
    background:var(--orange); color:#fff; font-size:16px; box-shadow:0 3px 10px rgba(240,116,34,.4);
    z-index:70; cursor:pointer;
    opacity:0; pointer-events:none; transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease;
    font-family:inherit;
  }
  .scroll-top-btn.show{
    opacity:1; pointer-events:auto; transform:translateY(0);
  }
  .tab{
    flex:1; text-align:center; padding:9px 0 7px; font-size:11.5px; color:#A7ABA0;
    display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    user-select:none; font-weight:500;
  }
  .tab .ic{
    font-size:18px; line-height:1;
    padding:4px 16px; border-radius:999px;
    transition:background-color .15s ease;
  }
  .tab.active{color:var(--green-deep); font-weight:800;}
  .tab.active .ic{background:var(--green-pale);}

  .screen{display:none; padding:16px 14px 10px; max-width:560px; margin:0 auto;}
  .screen.active{display:block;}

  /* ---- トップ画面 ---- */
  .company-card{
    background:var(--card); border-radius:var(--radius); margin-bottom:12px;
    box-shadow:0 2px 8px rgba(60,90,60,.07); overflow:hidden;
    border:1px solid var(--line);
  }
  .company-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:15px 16px; cursor:pointer;
  }
  .company-name{font-size:15.5px; font-weight:800; color:var(--green-deep);}
  .company-vacancy{font-size:12px; margin-top:3px; color:var(--textsub); font-weight:500;}
  .company-vacancy b{color:var(--red); font-size:15px; font-weight:800;}
  .company-phone{font-size:11.5px; color:var(--textsub); margin-top:2px;}
  .company-phone a{color:var(--green-deep); text-decoration:none;}
  .company-vacant-home{font-size:12px; margin-top:2px; color:var(--textsub); font-weight:500;}
  .company-vacant-home b{color:var(--red); font-weight:800;}
  .company-updated{font-size:10.5px; color:#AEB2A8; margin-top:4px;}
  .contact-label{
    font-size:11px; color:var(--green-deep); font-weight:800; padding:12px 16px 4px;
  }
  .contact-chips{
    display:flex; flex-direction:column; gap:6px;
    padding:0 16px 10px;
  }
  .contact-chip{
    font-size:11px; color:var(--textsub); background:var(--green-pale); border-radius:12px;
    padding:6px 11px; white-space:normal; align-self:flex-start;
  }
  .contact-chip a{color:var(--green-deep); text-decoration:none; font-weight:700;}
  .chevron{transition:transform .25s cubic-bezier(.4,0,.2,1); color:#C4C8BE; font-size:14px;}
  .company-card.open .chevron{transform:rotate(90deg);}
  .home-list{
    border-top:1px solid var(--line); overflow:hidden; max-height:0;
    transition:max-height .3s cubic-bezier(.4,0,.2,1);
    background:#FBFCF8;
  }
  .home-row{
    display:flex; flex-direction:column; gap:6px;
    padding:14px 16px; font-size:13.5px; border-bottom:2px solid #CFD3C8;
  }
  .home-row.alt{ background:#EDEEE9; }
  .home-row-top{display:flex; justify-content:space-between; align-items:center;}
  .home-address{
    font-size:11.5px; color:var(--textsub);
  }
  .home-building{
    margin-left:19px; margin-top:-2px;
  }
  .home-notes{
    font-size:11.5px; color:var(--textsub); background:var(--orange-pale); border-radius:10px;
    padding:8px 10px; white-space:pre-wrap; line-height:1.5;
  }
  .home-row:last-child{border-bottom:none;}
  .home-left{display:flex; flex-direction:column; gap:5px; align-items:flex-start;}
  .home-badges{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .gender-badge{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; flex-shrink:0;
  }
  .gender-male{background:#5B9BEF;}
  .gender-female{background:#F282A6;}
  .gender-any{background:#A98BE0;}
  .type-badge{
    font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; color:var(--orange-deep);
    background:var(--orange-pale); flex-shrink:0; white-space:nowrap;
  }
  .home-name{font-weight:700; font-size:14.5px;}
  .status-pill{
    font-size:11.5px; padding:3px 10px; border-radius:999px; font-weight:800; white-space:nowrap;
  }
  .status-vacant{background:var(--green-pale); color:var(--green-deep);}
  .status-full{background:var(--red-bg); color:var(--red);}
  .home-count{font-size:11.5px; color:var(--textsub); margin-left:6px; font-weight:500;}

  .empty-msg{text-align:center; color:#A7ABA0; font-size:13px; padding:40px 0; line-height:1.7;}

  .sort-bar{
    display:flex; gap:0; margin-bottom:14px;
    background:#fff; border-radius:999px; padding:4px;
    border:1px solid var(--line);
    box-shadow:0 1px 4px rgba(60,90,60,.06);
  }
  .sort-btn{
    flex:1; padding:8px 0; border-radius:999px; font-size:12.5px; border:none;
    background:transparent; color:#9BA095; cursor:pointer; font-weight:700;
    font-family:inherit;
    transition:background-color .15s ease, color .15s ease;
  }
  .sort-btn.active{
    background:var(--green); color:#fff;
    box-shadow:0 1px 4px rgba(47,169,102,.35);
  }

  /* ---- 掲示板 ---- */
  .board-post{
    background:var(--card); border-radius:var(--radius); padding:15px 16px; margin-bottom:11px;
    box-shadow:0 2px 8px rgba(60,90,60,.07);
    border:1px solid var(--line);
  }
  .board-meta{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; gap:8px;}
  .board-company{font-size:12px; font-weight:800; color:var(--orange-deep); background:var(--orange-pale); padding:3px 10px; border-radius:999px;}
  .board-date{font-size:11px; color:var(--textsub);}
  .board-author-top{font-size:11px; color:var(--textsub); font-weight:500;}
  .board-text{font-size:14px; line-height:1.65; white-space:pre-wrap;}
  .board-date-bottom{font-size:11px; color:#AEB2A8; margin-top:8px; text-align:right;}
  .board-author{font-size:11.5px; color:var(--textsub); margin-top:8px; text-align:right;}

  /* ---- 編集画面 ---- */
  .edit-section{

  let preTapScrollY = window.scrollY;

  function preserveScrollAnchoredTo(selector, renderFn){

  function escapeHtml(str){
    if(str === undefined || str === null) return "";
    return String(str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function formatDate(ts){
    const d = new Date(Number(ts));
    const pad = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function parseContactsJson(raw){
    if(Array.isArray(raw)) return raw;
    if(!raw) return [];
    try{
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      return [];
    }
  }
  function contactChipHtml(phone, contactPerson, noIcon){
    if(!phone && !contactPerson) return "";
    const phoneHtml = phone
      ? `<a href="tel:${escapeHtml(String(phone).replace(/[^0-9+]/g,""))}" onclick="event.stopPropagation()">${noIcon ? "" : "☎ "}${escapeHtml(phone)}</a>`
      : "";
    const personHtml = contactPerson ? escapeHtml(contactPerson) : "";
    let inner;
    if(phoneHtml && personHtml) inner = `${phoneHtml}（${personHtml}）`;
    else if(phoneHtml) inner = phoneHtml;
    else inner = personHtml;
    return `<span class="contact-chip">${inner}</span>`;
  }

  // ---------- Firestore 書き込み ----------
  function clean_(obj){
    const o = {};
    Object.keys(obj).forEach(k=>{ if(obj[k] !== undefined) o[k] = obj[k]; });
    return o;
  }
  function dbWrite(p){
    if(!db) return Promise.resolve();
    const col = n => db.collection(n);
    let task;
    switch(p.action){
      case "addCompany":
      case "updateCompany": {
        let contacts = p.contacts;
        if(typeof contacts === "string"){ try{ contacts = JSON.parse(contacts); }catch(e){ contacts = []; } }
        task = col("companies").doc(String(p.id)).set(clean_({
          id: p.id, name: p.name, address: p.address === undefined ? undefined : String(p.address),
          phone: p.phone || "", contactPerson: p.contactPerson || "",
          updatedAt: Number(p.updatedAt) || null, contacts: Array.isArray(contacts) ? contacts : [],
          hasPassword: p.hasPassword === true ? true : undefined
        }), {merge:true});
        break;
      }
      case "setCompanyPassword":
        task = col("companyPasswords").doc(String(p.id)).set({id: String(p.id), password: String(p.password)});
        break;
      case "deleteCompany": {
        task = col("homes").where("companyId","==",String(p.id)).get().then(async snap=>{
          const batch = db.batch();
          const photoSnaps = await Promise.all(snap.docs.map(d=> col("homePhotos").where("homeId","==",d.id).get()));
          photoSnaps.forEach(ps=> ps.forEach(d=> batch.delete(d.ref)));
          snap.forEach(d=> batch.delete(d.ref));
          batch.delete(col("companies").doc(String(p.id)));
          batch.delete(col("companyPasswords").doc(String(p.id)));
          return batch.commit();
        });
        break;
      }
      case "addHome":
      case "updateHome": {
        task = col("homes").doc(String(p.id)).set(clean_({
          id: p.id, companyId: String(p.companyId), name: p.name, gender: p.gender,
          capacity: Number(p.capacity) || 0, count: Number(p.count) || 0,
          notes: p.notes || "", postalCode: p.postalCode || "", address: p.address || "",
          homeType: p.homeType || "", buildingName: p.buildingName || "", phone: p.phone || ""
        }), {merge:true});
        break;
      }
      case "deleteHome":
        task = col("homePhotos").where("homeId","==",String(p.id)).get().then(snap=>{
          const batch = db.batch();
          snap.forEach(d=> batch.delete(d.ref));
          batch.delete(col("homes").doc(String(p.id)));
          return batch.commit();
        });
        break;
      case "addPhoto":
        task = col("homePhotos").doc(String(p.id)).set({id: String(p.id), homeId: String(p.homeId), data: p.data, order: Number(p.order) || Date.now()});
        break;
      case "deletePhoto":
        task = col("homePhotos").doc(String(p.id)).delete(); break;
      case "addPost":
        task = col("posts").doc(String(p.id)).set(clean_({
          id: p.id, companyId: String(p.companyId), author: p.author || "", text: p.text || "", timestamp: Number(p.timestamp) || Date.now()
        })); break;
      case "updatePost":
        task = col("posts").doc(String(p.id)).set({author: p.author || "", text: p.text || ""}, {merge:true}); break;
      case "deletePost":
        task = col("posts").doc(String(p.id)).delete(); break;
      default:
        return Promise.resolve();
    }
    const slowTimer = setTimeout(()=> showToast("サーバーに届いていません。通信状況を確認してください"), 8000);
    return task.then(()=>{ clearTimeout(slowTimer); }).catch(err=>{
      clearTimeout(slowTimer);
      console.error(err);
      showToast("保存に失敗しました（" + ((err && err.code) || "不明") + "）");
    });
  }

  // ---------- データ更新フロー ----------
  function saveLocalCache(){
    try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data)); }catch(e){}
  }
  function loadLocalCache(){
    try{
      const raw = localStorage.getItem(LOCAL_CACHE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d && d.companies && d.homes && d.posts) data = d;
      }
    }catch(e){}
  }

  const snapStore = { companies: null, homes: null, posts: null };
  function normalizeCompany(c){
    return {...c, updatedAt: Number(c.updatedAt) || null, contacts: Array.isArray(c.contacts) ? c.contacts : parseContactsJson(c.contacts)};
  }
  function applySnapshots(){
    if(!snapStore.companies || !snapStore.homes || !snapStore.posts) return;
    const next = {
      companies: snapStore.companies.map(normalizeCompany),
      homes: snapStore.homes.map(h=>({...h, companyId:String(h.companyId), capacity:Number(h.capacity)||0, count:Number(h.count)||0})),
      posts: snapStore.posts.map(p=>({...p, companyId:String(p.companyId), timestamp:Number(p.timestamp)||0}))
    };
    const changed = JSON.stringify(next) !== JSON.stringify(data);
    data = next;
    enforcePostLimit().forEach(p=> dbWrite({action:"deletePost", id:p.id}));
    saveLocalCache();
    setConnStatus("ok", "データベースと連携中");
    if(!changed) return;
    // 入力中は画面を作り直さない（入力が消えるのを防ぐ）
    const ae = document.activeElement;
    if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
    renderCurrentScreen();
  }
  let unsubscribers = [];
  function startRealtime(){
    unsubscribers.forEach(u=>u());
    unsubscribers = [];
    ["companies","homes","posts"].forEach(name=>{
      const u = db.collection(name).onSnapshot(snap=>{
        snapStore[name] = snap.docs.map(d=> ({...d.data(), id: d.id}));
        applySnapshots();
      }, err=>{
        console.error(err);
        setConnStatus("err", "接続エラー：" + ((err && err.code) || "不明"));
      });
      unsubscribers.push(u);
    });
  }

  // 画面は常に自動で最新になるため、silent=true の呼び出しは何もしない
  function refreshFromSheet(silent){
    if(silent || !db) return Promise.resolve();
    setConnStatus("busy", "更新中…");
    return Promise.all(["companies","homes","posts"].map(n=>
      db.collection(n).get({source:"server"}).then(snap=>{ snapStore[n] = snap.docs.map(d=>({...d.data(), id:d.id})); })
    )).then(()=>{
      applySnapshots();
    }).catch(()=>{
      setConnStatus("err", "接続に失敗しました（キャッシュ表示中）");
    });
  }

  // 画像を長辺960pxに縮小してJPEGのデータURLにする（約350KB以下になるまで画質を調整）
  function resizeImage(file, maxSide, quality){
    return new Promise((resolve, reject)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{
        URL.revokeObjectURL(url);
        let w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h){ reject(new Error("size")); return; }
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = quality;
        let out = canvas.toDataURL("image/jpeg", q);
        while(out.length > 350000 && q > 0.4){ q -= 0.1; out = canvas.toDataURL("image/jpeg", q); }
        resolve(out);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("load")); };
      img.src = url;
    });
  }

  function loadPhotos(homeId){
    if(photoCache.has(homeId)) return Promise.resolve(photoCache.get(homeId));
    return db.collection("homePhotos").where("homeId", "==", String(homeId)).get().then(snap=>{
      const list = snap.docs.map(d=>({ ...d.data(), id: d.id })).sort((a,b)=> (a.order||0) - (b.order||0));
      photoCache.set(homeId, list);
      return list;
    });
  }

  document.getElementById("screen-edit").addEventListener("change", async (e)=>{
    const input = e.target.closest("[data-photo-input]");
    if(!input) return;
    const mgr = input.closest(".photo-manager");
    const owner = mgr.dataset.photoOwner;
    const isDraft = mgr.dataset.draft === "1";
    let files = Array.from(input.files || []);
    input.value = "";
    if(files.length === 0) return;

    let current;
    if(isDraft){
      const draft = draftHomes.find(d=>d.tempId === owner);
      if(!draft) return;
      current = draft.photos.length;
    } else {
      try{ current = (await loadPhotos(owner)).length; }
      catch(err){ showToast("写真を読み込めませんでした。通信状況を確認してください"); return; }
    }
    const room = MAX_PHOTOS - current;
    if(room <= 0){ showToast(`写真は最大${MAX_PHOTOS}枚までです`); return; }
    if(files.length > room){ showToast(`写真は最大${MAX_PHOTOS}枚までです（先頭の${room}枚を追加します）`); files = files.slice(0, room); }

    showToast("写真を縮小しています…");
    let failed = 0;
    for(let i = 0; i < files.length; i++){
      try{
        const dataUrl = await resizeImage(files[i], 960, 0.78);
        if(isDraft){
          const draft = draftHomes.find(d=>d.tempId === owner);
          if(draft) draft.photos.push(dataUrl);

          const photo = { id: uid(), homeId: owner, data: dataUrl, order: Date.now() + i };
          photoCache.set(owner, [...(photoCache.get(owner) || []), photo]);
          dbWrite({action:"addPhoto", ...photo});

        renderThumbs(mgr);
      }catch(err){
        failed++;
      }

    if(failed) showToast("読み込めない画像がありました");
    else showToast(isDraft ? "写真を追加しました（登録ボタンで保存されます）" : "写真を追加しました");

  // ---------- 電話番号の自動ハイフン ----------
  function formatPhone(raw){
    const d = String(raw).replace(/[０-９]/g, c=> String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\D/g, "").slice(0, 11);
    if(!d) return "";
    let groups;
    if(d.startsWith("0120") || d.startsWith("0800")) groups = [4, 3, 3];   // フリーダイヤル
    else if(/^(050|070|080|090)/.test(d)) groups = [3, 4, 4];               // 携帯・IP電話
    else if(/^(03|06)/.test(d)) groups = [2, 4, 4];                        // 東京・大阪
    else groups = [3, 3, 4];                                                // 048 など
    const parts = [];
    let i = 0;
    for(const g of groups){
      if(i >= d.length) break;
      parts.push(d.slice(i, i + g));
      i += g;
    }
    return parts.join("-");
  }
  document.addEventListener("input", e=>{
    const el = e.target;
    if(!el || el.tagName !== "INPUT" || el.getAttribute("inputmode") !== "tel") return;
    if(e.isComposing) return;
    const before = el.value;
    const caret = el.selectionStart;
    const digitsBeforeCaret = before.slice(0, caret).replace(/\D/g, "").length;
    const formatted = formatPhone(before);
    if(formatted === before) return;
    el.value = formatted;
    // 入力位置（数字の個数）を保ったままカーソルを戻す
    let pos = 0, count = 0;
    while(pos < formatted.length && count < digitsBeforeCaret){
      if(/\d/.test(formatted[pos])) count++;
      pos++;
    }
    if(caret >= before.length) pos = formatted.length;
    try{ el.setSelectionRange(pos, pos); }catch(err){}
  });

  // ---------- パスワード入力ダイアログ ----------
  async function sha256Hex(str){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  // validate(入力値) が true を返せば成功。キャンセルなら false を返す
  function askPassword(title, validate){
    return new Promise(resolve=>{
      const ov = document.getElementById("pwOverlay");
      const input = document.getElementById("pwInput");
      const err = document.getElementById("pwErr");
      const ok = document.getElementById("pwOk");
      const cancel = document.getElementById("pwCancel");
      document.getElementById("pwTitle").textContent = title;
      input.value = ""; err.textContent = "";
      ov.classList.add("show");
      setTimeout(()=>input.focus(), 60);
      let busy = false;
      function close(result){
        ov.classList.remove("show");
        ok.onclick = cancel.onclick = input.onkeydown = null;
        resolve(result);
      }
      async function submit(){
        if(busy) return;
        busy = true; ok.disabled = true; err.textContent = "";
        let good = false;
        try{
          good = await validate(input.value);
        }catch(e){
          err.textContent = "確認できませんでした。通信状況を確認してください";
          busy = false; ok.disabled = false;
          return;
        }
        busy = false; ok.disabled = false;
        if(good){ close(true); }
        else{ err.textContent = "パスワードが違います"; input.value = ""; input.focus(); }
      }
      ok.onclick = submit;
      cancel.onclick = ()=> close(false);
      input.onkeydown = e=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); } };
    });
  }

    return askPassword(`「${c.name}」の編集パスワードを入力してください`, async v=>{
      const snap = await db.collection("companyPasswords").doc(String(id)).get();
      const real = snap.exists ? String(snap.data().password || "") : "";
      if(real && v === real){ unlockedCompanies.set(id, real); return true; }
      return false;
    });
  }

  // ---------- 管理者モード ----------
  function closeAdmin(){
    document.getElementById("adminOverlay").classList.remove("show");
    document.getElementById("adminBody").innerHTML = "";
  }
  async function renderAdmin(){
    const body = document.getElementById("adminBody");
    body.innerHTML = `<div class="small-gray">読み込み中…</div>`;
    try{
      const snap = await db.collection("companyPasswords").get();
      const pw = {};
      snap.forEach(d=>{ pw[d.id] = String(d.data().password || ""); });
      const list = [...data.companies].sort((a,b)=> collatorJa.compare(a.name, b.name));
      body.innerHTML = list.length === 0
        ? `<div class="small-gray">法人が登録されていません</div>`
        : `<div class="form-hint" style="margin-bottom:12px;">各法人の編集パスワードです。取り扱いにご注意ください。</div>` +
          list.map(c=>`
            <div class="admin-card">
              <div class="an">${escapeHtml(c.name)}</div>
              ${pw[c.id] ? `<div class="ap">${escapeHtml(pw[c.id])}</div>` : `<div class="ap none">パスワード未設定</div>`}
            </div>`).join("");
    }catch(e){
      body.innerHTML = `<div class="small-gray">読み込めませんでした。通信状況を確認してください</div>`;
    }
  }
  document.getElementById("adminBtn").addEventListener("click", async ()=>{
    const ok = await askPassword("管理者パスワードを入力してください", async v=>{
      return (await sha256Hex(v)) === ADMIN_HASH;
    });
    if(!ok) return;
    document.getElementById("adminOverlay").classList.add("show");
    renderAdmin();
  });
  document.getElementById("adminClose").addEventListener("click", closeAdmin);

  // ---------- 法人追加 ----------
  document.getElementById("addCompanyBtn").addEventListener("click", ()=>{
    const input = document.getElementById("newCompanyName");
    const phoneInput = document.getElementById("newCompanyPhone");
    const contactInput = document.getElementById("newCompanyContact");
    const pwInputEl = document.getElementById("newCompanyPassword");
    const addressInput = document.getElementById("newCompanyAddress");
    const address = addressInput.value.trim();
    const name = input.value.trim();
    const phone = phoneInput.value.trim();
    const contactPerson = contactInput.value.trim();
    const password = pwInputEl.value.trim();
    if(!name){ showToast("法人名を入力してください"); return; }
    if(password.length < 4){ showToast("編集パスワードを4文字以上で入力してください"); return; }
    const newCompany = {id: uid(), name, address, phone, contactPerson, contacts: [], hasPassword: true};
    data.companies.push(newCompany);
    unlockedCompanies.set(newCompany.id, password);
    saveLocalCache();
    input.value = "";
    phoneInput.value = "";
    contactInput.value = "";
    addressInput.value = "";
    pwInputEl.value = "";
    collapseForm("toggleAddCompanyBtn", "addCompanyBody", "＋法人を追加");
    preserveScroll(renderEdit);
    showToast("法人を追加しました");
    dbWrite({action:"setCompanyPassword", id:newCompany.id, password})
      .then(()=> dbWrite({action:"addCompany", id:newCompany.id, name:newCompany.name, address:newCompany.address, phone:newCompany.phone, contactPerson:newCompany.contactPerson, contacts: "[]", hasPassword: true}));
  });

  // 一言掲示板の投稿は最大15件まで。超えた分は古いものから自動的に削除する
  const MAX_BOARD_POSTS = 15;
  function enforcePostLimit(){
    if(data.posts.length <= MAX_BOARD_POSTS) return [];
    const sortedAsc = [...data.posts].sort((a,b)=> a.timestamp - b.timestamp);
    const overflow = sortedAsc.length - MAX_BOARD_POSTS;
    const removed = sortedAsc.slice(0, overflow);
    const removeIds = new Set(removed.map(p=>p.id));
    data.posts = data.posts.filter(p=>!removeIds.has(p.id));
    return removed;
  }

  // ---------- 投稿追加 ----------
  document.getElementById("addPostBtn").addEventListener("click", ()=>{
    const companyId = document.getElementById("postCompany").value;
    const author = document.getElementById("postAuthor").value.trim();
    const text = document.getElementById("postText").value.trim();
    if(!companyId){ showToast("法人を選択してください"); return; }
    if(!text){ showToast("本文を入力してください"); return; }
    const newPost = {id: uid(), companyId, author, text, timestamp: Date.now()};
    data.posts.push(newPost);
    const removed = enforcePostLimit();
    saveLocalCache();
    document.getElementById("postText").value = "";
    collapseForm("toggleAddPostBtn", "addPostBody", "＋投稿する");
    preserveScroll(renderBoard);
    showToast("投稿しました");
    dbWrite({action:"addPost", ...newPost})
      .then(()=> Promise.all(removed.map(p=> dbWrite({action:"deletePost", id:p.id}))))
      .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
  });

  // ---------- イベント委任（編集画面全体） ----------
  document.getElementById("screen-edit").addEventListener("click", (e)=>{
    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if(action === "save-company"){
      const block = btn.closest(".company-block");
      const name = block.querySelector("[data-field='company-name']").value.trim();
      const address = block.querySelector("[data-field='company-address']").value.trim();
      const phone = block.querySelector("[data-field='company-phone']").value.trim();
      const contactPerson = block.querySelector("[data-field='company-contact']").value.trim();
      if(!name){ showToast("法人名を入力してください"); return; }
      const company = data.companies.find(c=>c.id === id);
      const pwEl = block.querySelector("[data-field='company-password']");
      const newPw = pwEl ? pwEl.value.trim() : "";
      if(company && company.hasPassword && !newPw){ showToast("編集パスワードは空にできません"); return; }
      if(newPw && newPw.length < 4){ showToast("編集パスワードは4文字以上にしてください"); return; }
      if(company){
        const pwChanged = !!newPw && newPw !== (unlockedCompanies.get(id) || "");
        if(pwChanged){ company.hasPassword = true; unlockedCompanies.set(id, newPw); }
        company.name = name;
        company.address = address;
        company.phone = phone;
        company.contactPerson = contactPerson;
        // 追加した連絡先の入力内容を現在のDOMから読み取って反映する
        const contactRows = block.querySelectorAll("[data-contact-id]");
        company.contacts = Array.from(contactRows).map(row=>{
          const contactId = row.dataset.contactId;
          return {
            id: contactId,
            phone: row.querySelector("[data-field='contact-phone']").value.trim(),
            contactPerson: row.querySelector("[data-field='contact-person']").value.trim()
          };
        });
        saveLocalCache();
        preserveScrollAnchoredTo(`.company-block[data-company-id="${id}"]`, renderEdit);
        showToast("法人情報を保存しました");
        if(pwChanged) dbWrite({action:"setCompanyPassword", id, password:newPw});
        dbWrite({action:"updateCompany", id, name, address, phone, contactPerson, updatedAt: company.updatedAt || "", contacts: JSON.stringify(company.contacts), hasPassword: pwChanged ? true : undefined});
      }
      return;
    }

    if(action === "add-contact"){
      const company = data.companies.find(c=>c.id === id);
      if(!company) return;
      if(!company.contacts) company.contacts = [];
      company.contacts.push({ id: uid(), phone: "", contactPerson: "" });
      preserveScrollAnchoredTo(`.company-block[data-company-id="${id}"]`, renderEdit);
      return;
    }

    if(action === "del-contact"){
      const companyId = btn.dataset.companyId;
      const company = data.companies.find(c=>c.id === companyId);
      if(!company) return;
      company.contacts = (company.contacts || []).filter(ct=>ct.id !== id);
      preserveScrollAnchoredTo(`.company-block[data-company-id="${companyId}"]`, renderEdit);
      return;
    }

    if(action === "toggle-company-edit"){
      const block = btn.closest(".company-block");
      const opening = !block.classList.contains("open");
      if(opening){
        const comp = data.companies.find(x=>x.id === id);
        if(!comp || !comp.hasPassword || unlockedCompanies.has(id)){
          // パスワード不要（または入力済み）の法人は、これまで通りその場で開く
          openEditCompanyIds.add(id);
          block.classList.add("open");
        } else {
          unlockCompany(id).then(ok=>{
            if(!ok) return;
            openEditCompanyIds.add(id);
            preserveScrollAnchoredTo(`.company-block[data-company-id="${id}"]`, renderEdit);
          });
        }
      } else {
        openEditCompanyIds.delete(id);
        block.classList.remove("open");
      }
      return;
    }

    if(action === "pick-photo"){
      const mgr = btn.closest(".photo-manager");
      if(mgr) mgr.querySelector("[data-photo-input]").click();
      return;
    }

    if(action === "del-photo"){
      const mgr = btn.closest(".photo-manager");
      if(!mgr) return;
      const owner = mgr.dataset.photoOwner;
      const photoId = btn.dataset.photoId;
      if(mgr.dataset.draft === "1"){
        const draft = draftHomes.find(d=>d.tempId === owner);
        if(draft) draft.photos.splice(Number(photoId), 1);
        renderThumbs(mgr);
      } else {
        askConfirm("この写真を削除しますか？", ()=>{
          photoCache.set(owner, (photoCache.get(owner) || []).filter(p=>p.id !== photoId));
          renderThumbs(mgr);
          dbWrite({action:"deletePhoto", id: photoId});
        });
      }
      return;
    }

    if(action === "toggle-home-edit"){
      const item = btn.closest(".home-edit-item");
      const opening = !item.classList.contains("open");
      if(opening){
        openEditHomeIds.add(id);
        item.classList.add("open");
        const pm = item.querySelector(".photo-manager");
        if(pm){ renderThumbs(pm); loadPhotos(id).then(()=> renderThumbs(pm)); }
      } else {
        openEditHomeIds.delete(id);
        item.classList.remove("open");
      }
      return;
    }

    if(action === "add-home"){
      draftHomes.push({ tempId: uid(), companyId: id, name: "", gender: "male", capacity: 1, count: 0, notes: "", postalCode: "", address: "", homeType: "", buildingName: "", phone: "", photos: [] });
      preserveScrollAnchoredTo(`.company-block[data-company-id="${id}"]`, renderEdit);
      return;
    }

    if(action === "confirm-new-home"){
      const item = btn.closest("[data-temp-id]");
      const name = item.querySelector("[data-field='name']").value.trim() || "新しいホーム";
      const gender = item.querySelector("[data-field='gender']").value;
      const homeType = item.querySelector("[data-field='homeType']").value;
      const capacity = Math.max(0, parseInt(item.querySelector("[data-field='capacity']").value, 10) || 0);
      const count = Math.max(0, parseInt(item.querySelector("[data-field='count']").value, 10) || 0);
      const notes = item.querySelector("[data-field='notes']").value.trim();
      const postalCode = item.querySelector("[data-field='postalCode']").value.trim();
      const address = item.querySelector("[data-field='address']").value.trim();
      const buildingName = item.querySelector("[data-field='buildingName']").value.trim();
      const phone = item.querySelector("[data-field='phone']").value.trim();
      const draft = draftHomes.find(d=>d.tempId === id);
      if(!draft) return;
      const newHome = { id: uid(), companyId: draft.companyId, name, gender, capacity, count, notes, postalCode, address, homeType, buildingName, phone };
      data.homes.push(newHome);
      const draftPhotos = (draft.photos || []).map((dataUrl, i)=>({ id: uid(), homeId: newHome.id, data: dataUrl, order: Date.now() + i }));
      if(draftPhotos.length) photoCache.set(newHome.id, draftPhotos);
      draftHomes = draftHomes.filter(d=>d.tempId !== id);
      openEditHomeIds.add(newHome.id);
      touchCompanyUpdated(draft.companyId);
      saveLocalCache();
      preserveScrollAnchoredTo(`.company-block[data-company-id="${draft.companyId}"]`, ()=>{ renderEdit(); renderTop(); });
      showToast("ホームを登録しました");
      dbWrite({action:"addHome", ...newHome})
        .then(()=> Promise.all(draftPhotos.map(p=> dbWrite({action:"addPhoto", ...p}))));
      return;
    }

    if(action === "cancel-new-home"){
      const draft = draftHomes.find(d=>d.tempId === id);
      const companyId = draft ? draft.companyId : null;
      draftHomes = draftHomes.filter(d=>d.tempId !== id);
      if(companyId){
        preserveScrollAnchoredTo(`.company-block[data-company-id="${companyId}"]`, renderEdit);
      } else {
        preserveScroll(renderEdit);
      }
      return;
    }

    if(action === "save-home"){
      const item = btn.closest("[data-home-id]");
      const home = data.homes.find(h=>h.id === id);
      if(!home) return;
      home.name = item.querySelector("[data-field='name']").value.trim() || home.name;
      home.gender = item.querySelector("[data-field='gender']").value;
      home.homeType = item.querySelector("[data-field='homeType']").value;
      home.capacity = Math.max(0, parseInt(item.querySelector("[data-field='capacity']").value, 10) || 0);
      home.count = Math.max(0, parseInt(item.querySelector("[data-field='count']").value, 10) || 0);
      home.notes = item.querySelector("[data-field='notes']").value.trim();
      home.postalCode = item.querySelector("[data-field='postalCode']").value.trim();
      home.address = item.querySelector("[data-field='address']").value.trim();
      home.buildingName = item.querySelector("[data-field='buildingName']").value.trim();
      home.phone = item.querySelector("[data-field='phone']").value.trim();
      touchCompanyUpdated(home.companyId);
      saveLocalCache();
      preserveScrollAnchoredTo(`.company-block[data-company-id="${home.companyId}"]`, ()=>{ renderEdit(); renderTop(); });
      showToast("保存しました");
      dbWrite({action:"updateHome", id: home.id, companyId: home.companyId, name: home.name, gender: home.gender, capacity: home.capacity, count: home.count, notes: home.notes, postalCode: home.postalCode, address: home.address, homeType: home.homeType, buildingName: home.buildingName, phone: home.phone})
        .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
      return;
    }

    if(action === "del-home"){
      askConfirm("このホームを削除しますか？", ()=>{
        const removedHome = data.homes.find(h=>h.id === id);
        data.homes = data.homes.filter(h=>h.id !== id);
        if(removedHome) touchCompanyUpdated(removedHome.companyId);
        saveLocalCache();
        if(removedHome){
          preserveScrollAnchoredTo(`.company-block[data-company-id="${removedHome.companyId}"]`, renderEdit);
        } else {
          preserveScroll(renderEdit);
        }
        showToast("削除しました");
        dbWrite({action:"deleteHome", id})
          .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
      });
      return;
    }

    if(action === "del-company"){
      const delTarget = data.companies.find(c=>c.id === id);
      const delName = delTarget && delTarget.name ? delTarget.name : "この法人";
      askConfirm(`「${delName}」と、所属するホームをすべて削除しますか？`, ()=>{
        data.companies = data.companies.filter(c=>c.id !== id);
        data.homes = data.homes.filter(h=>String(h.companyId) !== String(id));
        saveLocalCache();
        preserveScroll(renderEdit);
        showToast("削除しました");
        dbWrite({action:"deleteCompany", id})
          .then(()=> setTimeout(()=>refreshFromSheet(true), 1200));
      });
      return;
    }
  });

  // ※ホーム情報は「保存」「登録」ボタンを押した時にのみ反映されます（自動保存はしません）

  // ---------- 上に戻るボタン ----------
  const scrollTopBtn = document.getElementById("scrollTopBtn");
  window.addEventListener("scroll", ()=>{
    scrollTopBtn.classList.toggle("show", window.scrollY > 250);
  }, { passive: true });
  scrollTopBtn.addEventListener("click", ()=>{
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ---------- 初期表示 ----------
  let started = false;
  let lastActivity = Date.now();
  const LAST_KEY = "gh_last_activity";
  let lastWrite = 0;
  function touchActivity(force){
    lastActivity = Date.now();
    if(force || lastActivity - lastWrite > 5000){
      lastWrite = lastActivity;
      try{ localStorage.setItem(LAST_KEY, String(lastActivity)); }catch(e){}
    }
  }
  // 最後に操作した時刻（アプリを閉じていた間も含めて判定するため端末に保存）
  function lastActiveAt(){
    try{
      const v = Number(localStorage.getItem(LAST_KEY));
      return v > 0 ? v : 0;
    }catch(e){ return lastActivity; }
  }
  function isIdleExpired(){
    return Date.now() - lastActiveAt() >= IDLE_MINUTES * 60 * 1000;
  }
  function stopApp(){
    unlockedCompanies.clear();
    openEditCompanyIds.clear();
    photoCache.clear();
    closeHomeSheet(true);
    closePwDialog();
    closeAdmin();
    unsubscribers.forEach(u=>u());
    unsubscribers = [];
    snapStore.companies = snapStore.homes = snapStore.posts = null;
    started = false;
  }
  function startApp(){
    if(started) return;
    started = true;
    // 旧バージョン（スプレッドシート版）の端末内データを一度消去し、Firebaseのデータだけを表示する
    try{
      if(!localStorage.getItem("gh_fb_reset_done")){
        ["gh_vacancy_cache_v1","gh_gas_url","gh_auth_ok_v1","gh_vacancy_cache_fb1"].forEach(k=> localStorage.removeItem(k));
        localStorage.setItem("gh_fb_reset_done","1");
      }
    }catch(e){}
    loadLocalCache();
    renderTop();
    setConnStatus("busy", "接続中…");
    startRealtime();
    setTimeout(()=>{
      if(!snapStore.companies || !snapStore.homes || !snapStore.posts){
        setConnStatus("err", "データベースに接続できません（通信環境を確認し「更新」を押してください）");
      }
    }, 10000);
  }

  // ---------- ログイン（Firebase Authentication・共通パスワード） ----------
  function setupAuth(){
    const gate = document.getElementById("authGate");
    const input = document.getElementById("authInput");
    const btn = document.getElementById("authBtn");
    const err = document.getElementById("authErr");

    if(!CONFIG_OK){
      gate.style.display = "flex";
      err.textContent = "Firebaseの設定（firebaseConfig）が未入力です";
      btn.disabled = true;
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
    }catch(e){
      err.textContent = "初期化に失敗しました（" + ((e && e.code) || e) + "）。Safariなど標準のブラウザで開いてください";
      btn.disabled = true;
      return;
    }
    db = firebase.firestore();
    try{ db.settings({experimentalAutoDetectLongPolling: true, merge: true}); }catch(e){}

    async function submit(){
      err.textContent = "";
      btn.disabled = true;
      try{
        touchActivity(true); // ログイン直後に「時間切れ」と誤判定されないよう先に記録
        await auth.signInWithEmailAndPassword(LOGIN_EMAIL, input.value);
        // ログイン状態の通知が来ない環境でも先に進めるよう、成功時に直接開く
        gate.style.display = "none";
        startApp();
      }catch(e){
        const code = e && e.code || "";
        if(code === "auth/network-request-failed") err.textContent = "通信できません。電波を確認してください";
        else if(code === "auth/too-many-requests") err.textContent = "試行回数が多すぎます。しばらくしてからお試しください";
        else err.textContent = "パスワードが違います";
        input.value = "";
        input.focus();
      }
      btn.disabled = false;
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } });

    auth.onAuthStateChanged(user=>{
      if(user){
        // 前回の操作から時間がたっていたら（ホーム画面から開き直した場合なども）ログインし直す
        if(isIdleExpired()){
          auth.signOut();
          return;
        }
        gate.style.display = "none";
        touchActivity(true);
        startApp();
      }else{
        stopApp();
        gate.style.display = "flex";
        input.value = "";
        setTimeout(()=>input.focus(), 100);
      }
    });

    // ---- 無操作タイムアウト ----
    function checkIdle(){
      if(!auth || !auth.currentUser) return;
      if(isIdleExpired()){
        auth.signOut();
      }
    }
    ["touchstart","click","keydown","scroll","mousemove"].forEach(ev=>{
      window.addEventListener(ev, ()=>{ if(auth && auth.currentUser) touchActivity(false); }, {passive:true, capture:true});
    });
    setInterval(checkIdle, 15000);
    // スマホでバックグラウンドから戻った時にも判定する
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkIdle(); });
    window.addEventListener("pageshow", checkIdle);
  }
  setupAuth();
})();
</script>
